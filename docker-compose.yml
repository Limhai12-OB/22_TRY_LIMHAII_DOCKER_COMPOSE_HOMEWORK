services:


  postgres:
    image: postgres:18-alpine
    container_name: docker-compose-homework-postgres

    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME}" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s


  keycloak-postgres:
    image: postgres:18-alpine
    container_name: docker-compose-homework-keycloak-postgres

    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD}

    volumes:
      - keycloak_postgres_data:/var/lib/postgresql

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U keycloak -d keycloak" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s



  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: docker-compose-homework-keycloak

    command: start-dev

    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}

      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}

    ports:
      - "8080:8080"
      - "8443:8443"

    depends_on:
      keycloak-postgres:
        condition: service_healthy


  app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: docker-compose-homework-app

    ports:
      - "8081:8080"

    environment:
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}

    depends_on:
      postgres:
        condition: service_healthy


volumes:
  postgres_data:
  keycloak_postgres_data: